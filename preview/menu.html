<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<meta name="theme-color" content="#FDF7EF" />
<title>Col Sabor · Menú</title>
<style>
:root{
  --fondo:#FDF7EF; --fondo2:#FFFFFF; --tinta:#3B2A1E; --tinta2:#8B7561;
  --acento:#C2551A; --acento2:#B4551F; --tarjeta:#FFFFFF; --borde:#EADBC8;
  --radio:20px; --max:1280px; --sombra:0 12px 30px rgba(122,79,42,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit}
.cont{width:100%;max-width:var(--max);margin:0 auto;padding:0 18px}
@media(min-width:768px){.cont{padding:0 26px}}

/* ---------- portada ---------- */
.portada{position:relative;isolation:isolate;overflow:hidden;border-bottom:1px solid var(--borde)}
.portada .fondo-foto{position:absolute;inset:0;background:#f3e6d4 center/cover no-repeat;filter:brightness(.72) saturate(1.05);transform:scale(1.05);z-index:-2}
.portada::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(253,247,239,.72) 0%,rgba(253,247,239,.92) 55%,var(--fondo) 100%)}
.portada-in{display:flex;flex-direction:column;gap:18px;padding:40px 0 36px;max-width:820px}
.marca{display:flex;align-items:center;gap:16px}
.marca img{width:76px;height:76px;border-radius:22px;object-fit:cover;border:3px solid #fff;box-shadow:var(--sombra);flex:0 0 auto}
.marca h1{margin:0;font-size:clamp(1.7rem,4.6vw,2.8rem);letter-spacing:.2px;line-height:1.05;color:var(--tinta)}
.marca .lema{margin:6px 0 0;color:var(--tinta2);font-size:clamp(.94rem,2.3vw,1.08rem);max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.82);border:1px solid var(--borde);padding:9px 14px;border-radius:999px;font-size:.85rem;color:var(--tinta2);box-shadow:0 2px 8px rgba(122,79,42,.06)}
.chip b{color:var(--tinta);font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta a,.cta button{min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;border-radius:15px;font-weight:800;font-size:1rem;border:0;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.cta a:hover{transform:translateY(-2px);filter:brightness(1.04)}
.cta .principal{background:var(--acento);color:#fff;box-shadow:0 10px 24px rgba(226,101,43,.32)}
.cta .secundario{background:var(--tinta);color:#fff}

/* ---------- barra de categorías ---------- */
.barra{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--borde)}
.barra-in{display:flex;align-items:center;gap:14px;padding:12px 0}
.filtros{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1 1 auto;padding:2px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--borde);background:#fff;color:var(--tinta2);font-weight:700;font-size:.95rem;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.filtros button.on{background:var(--acento);border-color:var(--acento);color:#fff}
.filtros button:focus-visible,.agregar:focus-visible,.bolsa:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
@media(min-width:960px){.filtros{overflow:visible;flex-wrap:wrap;padding:0}}

/* ---------- catálogo ---------- */
#catalogo{padding:28px 0 132px}
.grupo{margin:0 0 40px;scroll-margin-top:86px}
.grupo-cab{display:flex;align-items:baseline;gap:12px;margin:0 0 18px}
.grupo-cab h2{margin:0;font-size:clamp(1.18rem,2.7vw,1.56rem);letter-spacing:.2px}
.grupo-cab h2::before{content:"";display:inline-block;width:6px;height:1.05em;background:var(--acento);border-radius:3px;margin-right:10px;vertical-align:-2px}
.grupo-cab span{color:var(--tinta2);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:620px){.grid{gap:18px}}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}}

.tarjeta{display:flex;flex-direction:column;background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra);transition:transform .18s,box-shadow .18s}
.tarjeta:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(122,79,42,.16)}
.foto{position:relative;display:block;width:100%;border:0;padding:0;background:#F3E8DA;cursor:pointer}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover}
.foto::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(180deg,transparent,rgba(59,42,30,.28));pointer-events:none}
.sello{position:absolute;top:10px;left:10px;z-index:2;background:var(--acento2);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:999px;text-transform:uppercase}
.tarjeta.agotado .foto img{filter:grayscale(1);opacity:.6}
.datos{padding:14px 15px 16px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.datos h3{margin:0;font-size:clamp(.97rem,2.4vw,1.08rem);line-height:1.28;font-weight:800;overflow-wrap:anywhere}
.meta{margin:0;color:var(--tinta2);font-size:.83rem;min-height:1.15em}
/* La fila precio+botón se envuelve: en celulares angostos (320-414 px) el botón «Agregar» no cabía
   al lado del precio y quedaba recortado por el overflow:hidden de la tarjeta. */
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.precio{font-weight:900;font-size:clamp(1.02rem,2.7vw,1.22rem);color:var(--acento2);letter-spacing:.2px;min-width:0}
.agregar{min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:12px;background:var(--acento);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;transition:filter .15s;flex:0 0 auto;white-space:nowrap;margin-left:auto}
@media(max-width:400px){.agregar{padding:0 12px;font-size:.9rem}}
.agregar:hover{filter:brightness(1.06)}
.agregar:disabled{background:#E7DAC9;color:#9c8b78;cursor:not-allowed}
.linea.agotado{opacity:.62}
.linea.agotado .n{text-decoration:line-through}
.aviso.promocion{background:rgba(255,195,0,.12);border-color:var(--acento2);color:var(--acento2)}
.cargando{padding:70px 0;text-align:center;color:var(--tinta2)}
.aviso{margin:22px 0;padding:16px 18px;border-radius:16px;background:#FBEFE2;border:1px solid var(--acento);color:#8A3B10}
.pie{border-top:1px solid var(--borde);padding:26px 0 calc(120px + env(safe-area-inset-bottom));color:var(--tinta2);font-size:.86rem;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}

/* ---------- bolsa + carrito ---------- */
.bolsa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 20px;border:0;border-radius:999px;background:var(--acento);color:#fff;font-weight:800;font-size:.98rem;box-shadow:0 14px 30px rgba(122,79,42,.32);cursor:pointer}
.bolsa .cuenta{display:grid;place-items:center;min-width:26px;height:26px;border-radius:999px;background:rgba(0,0,0,.18);font-size:.84rem}
.velo{position:fixed;inset:0;z-index:70;background:rgba(59,42,30,.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.velo.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;flex-direction:column;max-height:88dvh;background:var(--fondo2);border:1px solid var(--borde);border-radius:22px 22px 0 0;transform:translateY(103%);transition:transform .28s cubic-bezier(.22,.8,.2,1);box-shadow:0 -18px 44px rgba(122,79,42,.22)}
.panel.on{transform:none}
@media(min-width:900px){
  .panel{left:auto;right:0;top:0;bottom:0;width:min(420px,92vw);max-height:100dvh;border-radius:22px 0 0 22px;transform:translateX(104%)}
  .panel.on{transform:none}
}
.panel-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--borde);flex:0 0 auto}
.panel-cab h2{margin:0;font-size:1.08rem}
.panel-cab button{min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--borde);background:#fff;color:var(--tinta);font-size:1.15rem;cursor:pointer}
.lineas{flex:1 1 auto;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.vacio{margin:26px 0;text-align:center;color:var(--tinta2);font-size:.92rem;line-height:1.5}
.linea{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--borde);border-radius:16px;background:#fff}
.linea img{width:60px;height:60px;border-radius:12px;object-fit:cover}
.linea .n{font-weight:700;font-size:.94rem;line-height:1.25}
.linea .p{color:var(--tinta2);font-size:.84rem;margin-top:3px}
.linea .ctrl{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.linea .ctrl button{min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--borde);background:var(--fondo);color:var(--tinta);font-weight:800;font-size:1rem;cursor:pointer}
.linea .cant{min-width:26px;text-align:center;font-weight:800}
.linea .quitar{margin-left:auto;border:0;background:transparent;color:var(--tinta2);font-size:.82rem;text-decoration:underline}
.panel-pie{flex:0 0 auto;display:flex;flex-direction:column;gap:12px;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--borde);background:#fff}
@media(min-width:900px){.panel-pie{padding-bottom:18px}}
.totales{display:flex;align-items:baseline;justify-content:space-between;color:var(--tinta2);font-size:.92rem}
.totales strong{color:var(--acento2);font-size:1.42rem;font-weight:900}
#pedir{min-height:54px;border:0;border-radius:16px;background:var(--acento);color:#fff;font-weight:900;font-size:1.02rem;cursor:pointer}
#pedir:disabled{background:#E7DAC9;color:#9c8b78;cursor:not-allowed}

/* ---------- ficha ---------- */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(59,42,30,.55);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .caja{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:#fff;border:1px solid var(--borde);border-radius:22px;box-shadow:0 24px 60px rgba(59,42,30,.3)}
.modal img{width:100%;aspect-ratio:16/10;object-fit:cover}
.modal .txt{display:flex;flex-direction:column;gap:12px;padding:18px 20px 22px}
.modal h3{margin:0;font-size:1.3rem}
.modal p{margin:0;color:var(--tinta2);line-height:1.5}
.modal .precio{font-size:1.25rem}
.cerrar{min-height:50px;border-radius:14px;background:var(--fondo);border:1px solid var(--borde);color:var(--tinta);font-weight:800;cursor:pointer}

    /* ---- KZ-MENU-002 ---- */
    /* Botón «Agregar»: en pantallas angostas no cabía junto al precio y la tarjeta lo recortaba. */
    .fila{flex-wrap:wrap}
    .precio{min-width:0}
    .agregar{flex:0 0 auto;white-space:nowrap;margin-left:auto}
    @media(max-width:400px){.agregar{padding:0 12px;font-size:.9rem}}
    /* El logotipo del negocio se muestra entero, sin recortes. */
    .marca img{object-fit:contain}
    /* Aviso de pedido/error dentro de la página (sustituye al alert nativo). */
    .aviso--error{border-width:2px;font-weight:700}
/* ---- KZ-MENU-004 · botón de cantidad estilo Brosty Papas ---- */
.fila .accion{display:inline-flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto}
.stepper[hidden],.agregar[hidden]{display:none}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--borde);border-radius:999px;padding:2px}
.stepper button{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--acento);color:#fff;font-size:1.15rem;font-weight:900;line-height:1;cursor:pointer;transition:filter .15s}
.stepper button:hover{filter:brightness(1.12)}
.stepper button:focus-visible{outline:3px solid var(--acento2);outline-offset:2px}
.stepper button[data-accion="restar"]{background:transparent;color:var(--acento);border:2px solid var(--acento);font-size:1.2rem}
.stepper span{min-width:26px;text-align:center;font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums}
</style>

<body>

<script>
/* KONFÍO ZINC · KZ-UI-012 · menú Col Sabor (crema · café · naranja).
   Catálogo: Firebase primero; copia del repositorio como respaldo. Identificadores originales. */
const NEGOCIO = {
  nombre: "Col Sabor",
  lema: "Comida casera con sazón de casa",
  carpeta: (function () { try { return /\/preview\//.test(location.pathname) ? "../" : ""; } catch (e) { return "../"; } })(),
  ns: "colsabor",
  icono: "assets/logo/logo-colsabor.jpg",
  pendientesAprobacion: []
};

const $ = (s) => document.querySelector(s);
const plato = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const CLAVE_CARRITO = "ks-carrito-" + NEGOCIO.ns; /* un carrito por negocio: ambos menús comparten dominio */
let productos = [], config = {}, carrito = (function () { try { const v = localStorage.getItem(CLAVE_CARRITO) || localStorage.getItem("ks-carrito"); return JSON.parse(v || "{}"); } catch (e) { return {}; } })();

function esc(v) { return String(v == null ? "" : v).replace(/[<>&"']/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" }[c])); }
function urlImagen(p) { const v = String((p && p.imagen) || ""); return /^https?:\/\//i.test(v) ? v : NEGOCIO.carpeta + v.replace(/^\.?\//, ""); }
function ancla(t) { return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }

function qaMenu() {
  try {
    const host = location.hostname;
    if (host !== "localhost" && host !== "127.0.0.1") return null;
    if (new URLSearchParams(location.search).get("emulador") !== "1") return null;
    return { base: "http://127.0.0.1:9000", ns: "?ns=demo-sec-v5-default-rtdb" };
  } catch (e) { return null; }
}
function baseDatos() {
  const qa = qaMenu();
  const real = config.databaseURL || "https://el-titi-menu-default-rtdb.firebaseio.com";
  const base = ((qa && qa.base) || real).replace(/\?.*$/, "").replace(/\/$/, "");
  return { base: base, consultaNs: (qa && qa.ns) || "" };
}

/* ---- catálogo: Firebase Realtime Database es la fuente oficial ---- */
let suscripcion = null, sondeo = null, conexion = true, ultimaFirma = null;

async function catalogoRemoto() {
  const b = baseDatos();
  const r = await fetch(b.base + "/" + NEGOCIO.ns + "/productos.json" + b.consultaNs, { cache: "no-store" });
  if (!r.ok) throw new Error("Firebase HTTP " + r.status);
  const obj = await r.json();
  if (!obj || typeof obj !== "object") return [];
  return Object.entries(obj).map(([id, v]) => Object.assign({ id: id }, v)).filter((p) => p && p.nombre);
}

function aplicarCatalogo(lista) {
  const ocultos = new Set((NEGOCIO.pendientesAprobacion || []).map(String));
  // Los agotados y los ocultos no entran al catálogo de la vista: si no están, no se pintan.
  productos = (lista || []).filter((p) => p && p.agotado !== true && !ocultos.has(String(p.id)));
  let limpio = false;
  Object.keys(carrito).forEach((id) => { if (!productos.some((p) => String(p.id) === id)) { delete carrito[id]; limpio = true; } });
  if (limpio) guardar();
  pintarPortada();
  pintar();
}

function enLinea(ok) {
  conexion = ok;
  if (!ok) {
    $("#aviso").innerHTML = '<div class="aviso">No podemos verificar la disponibilidad del menú en este momento. No mostramos productos para no dar por buenos datos antiguos y no se pueden registrar pedidos hasta recuperar la conexión.</div>';
    $("#lista").innerHTML = '<p class="cargando">Sin conexión con el menú. Reintentando…</p>';
    $("#cats").innerHTML = "";
  } else {
    $("#aviso").innerHTML = config.promocion ? '<div class="aviso promocion">' + esc(config.promocion) + "</div>" : "";
  }
  if ($("#pedir")) pintarCarrito();
}

function cerrarSuscripcion() {
  if (suscripcion) { try { suscripcion.close(); } catch (e) {} suscripcion = null; }
}

function iniciarSondeo() {
  if (sondeo) return;
  const cada = qaMenu() ? 1200 : 15000;
  sondeo = setInterval(async () => {
    try { aplicarCatalogo(await catalogoRemoto()); enLinea(true); }
    catch (e) { enLinea(false); }
  }, cada);
}

/* Actualización en vivo: el administrador cambia algo en el panel y el menú se refresca solo. */
function suscribir() {
  cerrarSuscripcion();
  const b = baseDatos();
  const url = b.base + "/" + NEGOCIO.ns + "/productos.json" + b.consultaNs;
  if (typeof EventSource === "undefined") { iniciarSondeo(); return; }
  let es;
  try { es = new EventSource(url); } catch (e) { iniciarSondeo(); return; }
  suscripcion = es;
  const refrescar = (() => { let t = null; return () => { clearTimeout(t); t = setTimeout(async () => { try { aplicarCatalogo(await catalogoRemoto()); enLinea(true); } catch (e) { enLinea(false); } }, 220); }; })();
  es.addEventListener("put", (ev) => {
    try {
      const d = JSON.parse(ev.data);
      const obj = (d && d.data) || {};
      const firma = JSON.stringify(obj);
      if (firma === ultimaFirma) return;
      ultimaFirma = firma;
      const lista = Object.entries(obj).map(([id, v]) => Object.assign({ id: id }, v)).filter((p) => p && p.nombre);
      enLinea(true);
      aplicarCatalogo(lista);
    } catch (err) { refrescar(); }
  });
  es.addEventListener("patch", refrescar);
  es.addEventListener("cancel", () => { enLinea(false); iniciarSondeo(); });
  es.onerror = () => { if (es.readyState === 2) { enLinea(false); iniciarSondeo(); } };
}

/* Verificación obligatoria antes de registrar el pedido. */
async function verificarAntesDePedir(items) {
  const fresca = await catalogoRemoto();
  const mapa = new Map(fresca.map((p) => [String(p.id), p]));
  const bloqueos = [], validos = [];
  items.forEach((it) => {
    const p = mapa.get(String(it.id));
    if (!p) bloqueos.push("«" + it.nombre + "» ya no está en el menú");
    else if (p.agotado === true) bloqueos.push("«" + p.nombre + "» está agotado");
    else validos.push({ id: p.id, nombre: p.nombre, precio: p.precio || 0, cantidad: it.cantidad });
  });
  return { bloqueos: bloqueos, items: validos, catalogo: fresca };
}

async function cargar() {
  try {
    const rc = fetch(NEGOCIO.carpeta + "data/configuracion.json", { cache: "no-store" }).catch(() => null);
    const lista = await catalogoRemoto();
    const res = await rc;
    if (res && res.ok) { try { config = await res.json(); } catch (e) { config = {}; } }
    ultimaFirma = null;
    enLinea(true);
    aplicarCatalogo(lista);
    if (!productos.length) {
      $("#lista").innerHTML = '<p class="cargando">El menú está vacío en este momento.</p>';
    }
    console.info("[menú] " + productos.length + " productos desde Firebase");
    suscribir();
  } catch (e) {
    console.warn("[menú] no se pudo leer Firebase: " + e.message);
    productos = [];
    enLinea(false);
    pintarPortada();
    iniciarSondeo();
  }
}

function horarioTexto(h) {
  const dias = String(h.dias || "").split(",").map((d) => ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"][+d] || "").filter(Boolean);
  const dos = (n) => String(n).padStart(2, "0") + ":00";
  if (!dias.length || h.inicio == null) return "";
  return dias.join("·") + " de " + dos(h.inicio) + " a " + dos(h.fin);
}

function pintarPortada() {
  $("#marca").textContent = NEGOCIO.nombre;
  $("#lema").textContent = NEGOCIO.lema;
  $("#logo").src = NEGOCIO.carpeta + NEGOCIO.icono;
  try { const prev = document.querySelector('link[rel="icon"]'); if (prev) prev.remove(); const ic = document.createElement("link"); ic.rel = "icon"; ic.href = NEGOCIO.carpeta + NEGOCIO.icono; document.head.appendChild(ic); } catch (e) {}
  const destacado = productos.find((p) => p.destacado === true && p.imagen) || productos.find((p) => p.imagen);
  if (destacado) $("#fondo-foto").style.backgroundImage = 'url("' + urlImagen(destacado) + '")';
  const chips = [];
  if (config.promocion) chips.push("<b>Hoy</b> " + esc(config.promocion.replace(/^[^\wÁÉÍÓÚÑáéíóúñ]+\s*/, "")));
  if (config.horario && config.horario.inicio != null) chips.push("<b>Horario</b> " + esc(horarioTexto(config.horario)));
  if (config.ubicacion) chips.push("<b>Dónde</b> " + esc(config.ubicacion));
  chips.push("<b>" + productos.length + "</b> productos disponibles");
  $("#chips").innerHTML = chips.map((c) => '<span class="chip">' + c + "</span>").join("");
  const tel = String(config.whatsapp || config.telefono || "").replace(/[^0-9]/g, "");
  if (tel) $("#cta-wa").href = "https://wa.me/" + tel; else $("#cta-wa").style.display = "none";
  $("#pie-dir").textContent = [config.ubicacion, config.telefono ? "Tel. " + config.telefono : ""].filter(Boolean).join(" · ");
}

function categorias() {
  // Solo cuentan los productos que se van a ver: así no quedan secciones vacías.
  const visibles = productos.filter((p) => p.agotado !== true);
  const presentes = [...new Set(visibles.map((p) => p.categoria).filter(Boolean))];
  const orden = (config.categorias || []).filter((c) => presentes.includes(c));
  return orden.concat(presentes.filter((c) => !orden.includes(c)));
}

function tarjeta(p) {
  // Un producto agotado no se pinta: ni tarjeta gris, ni hueco en la rejilla.
  if (p.agotado === true) return "";
  const meta = [(p.etiquetas || []).join(" · "), p.tiempo ? p.tiempo + " min" : ""].filter(Boolean).join(" · ");
  return '<article class="tarjeta">' +
    '<button class="foto" data-ver="' + esc(p.id) + '" aria-label="Ver ' + esc(p.nombre) + '">' +
      '<img src="' + urlImagen(p) + '" alt="' + esc(p.nombre) + '" loading="lazy" onerror="this.src=\'' + NEGOCIO.carpeta + "assets/logo/no-image.png" + '\'">' +
    "</button>" +
    '<div class="datos"><h3>' + esc(p.nombre) + "</h3>" +
    '<p class="meta">' + esc(meta) + "</p>" +
    '<div class="fila"><span class="precio">' + plato.format(p.precio || 0) + "</span>" +
    '<span class="accion" data-id="' + esc(p.id) + '"><button class="agregar" data-add="' + esc(p.id) + '"' + ">Agregar</button></span></div></div></article>";
}

function pintar() {
  const cats = categorias();
  $("#cats").innerHTML = cats.map((c, i) => '<button data-cat="' + esc(ancla(c)) + '"' + (i === 0 ? ' class="on"' : "") + ">" + esc(c) + "</button>").join("");
  $("#lista").innerHTML = cats.map((c) => {
    const items = productos.filter((p) => p.categoria === c && p.agotado !== true);
    return '<section class="grupo" id="cat-' + ancla(c) + '"><div class="grupo-cab"><h2>' + esc(c) + "</h2><span>" + items.length + " " + (items.length === 1 ? "producto" : "productos") + '</span></div><div class="grid">' + items.map(tarjeta).join("") + "</div></section>";
  }).join("");
  $("#cats").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    $("#cats").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    const s = document.getElementById("cat-" + b.dataset.cat);
    if (s) s.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  $("#lista").querySelectorAll("[data-ver]").forEach((b) => b.addEventListener("click", () => abrir(b.dataset.ver)));
  $("#lista").querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => sumar(b.dataset.add)));
  pintarCarrito();
}

function abrir(id) {
  const p = productos.find((x) => String(x.id) === String(id));
  if (!p) return;
  $("#mImg").src = urlImagen(p);
  $("#mTitulo").textContent = p.nombre;
  $("#mDesc").textContent = (p.etiquetas || []).join(" · ") || (p.tiempo ? "Listo en " + p.tiempo + " minutos" : "Hecho al momento");
  $("#mPrecio").textContent = plato.format(p.precio || 0) + (p.agotado ? " · Agotado" : "");
  $("#modal").classList.add("on");
}
$("#mCerrar").addEventListener("click", () => $("#modal").classList.remove("on"));
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("#modal").classList.remove("on"); });

function guardar() { localStorage.setItem(CLAVE_CARRITO, JSON.stringify(carrito)); }
function sumar(id) { const p = productos.find((x) => String(x.id) === String(id)); if (!p || p.agotado) return; carrito[id] = (carrito[id] || 0) + 1; guardar(); pintarCarrito(); }
function quitarUno(id) { carrito[id] = (carrito[id] || 0) - 1; if (carrito[id] <= 0) delete carrito[id]; guardar(); pintarCarrito(); }
function borrar(id) { delete carrito[id]; guardar(); pintarCarrito(); }

function lineasCarrito() {
  return Object.keys(carrito).map((id) => {
    const p = productos.find((x) => String(x.id) === String(id));
    return p && carrito[id] > 0 ? { p: p, cant: carrito[id] } : null;
  }).filter(Boolean);
}

function pintarCarrito() {
  const ls = lineasCarrito();
  const total = ls.reduce((s, l) => s + (l.p.precio || 0) * l.cant, 0);
  const n = ls.reduce((s, l) => s + l.cant, 0);
  const conAgotado = ls.some((l) => l.p.agotado === true);
  $("#lineas").innerHTML = ls.length ? ls.map((l) =>
    '<div class="linea' + (l.p.agotado ? " agotado" : "") + '"><img src="' + urlImagen(l.p) + '" alt="">' +
    '<div><div class="n">' + esc(l.p.nombre) + (l.p.agotado ? ' <span class="sello">Agotado</span>' : "") +
    '</div><div class="p">' + plato.format(l.p.precio || 0) + " c/u</div>" +
    '<div class="ctrl"><button data-menos="' + esc(l.p.id) + '" aria-label="Quitar uno de ' + esc(l.p.nombre) + '">−</button>' +
    '<span class="cant">' + l.cant + '</span>' +
    '<button data-mas="' + esc(l.p.id) + '" aria-label="Agregar uno de ' + esc(l.p.nombre) + '"' + (l.p.agotado ? " disabled" : "") + '>+</button>' +
    '<button class="quitar" data-borrar="' + esc(l.p.id) + '">Eliminar</button></div></div></div>').join("")
    : '<p class="vacio">Tu pedido está vacío.<br>Toca «Agregar» en los productos que quieras.</p>';
  $("#lineas").querySelectorAll("[data-mas]").forEach((b) => b.addEventListener("click", () => sumar(b.dataset.mas)));
  $("#lineas").querySelectorAll("[data-menos]").forEach((b) => b.addEventListener("click", () => quitarUno(b.dataset.menos)));
  $("#lineas").querySelectorAll("[data-borrar]").forEach((b) => b.addEventListener("click", () => borrar(b.dataset.borrar)));
  $("#tot").textContent = plato.format(total);
  $("#tot-final").textContent = plato.format(total);
  $("#cuenta").textContent = n;
  const bloqueado = n === 0 || conAgotado || !conexion;
  $("#pedir").disabled = bloqueado;
  $("#pedir").textContent = (!conexion && n > 0) ? "Sin conexión" : (conAgotado && n > 0) ? "Revisa tu pedido" : "Pedir por WhatsApp";
  pintarAcciones();
}

/* ---- KZ-MENU-004 · botón de cantidad estilo Brosty Papas ----
   «Agregar» muta a [ − ][ cantidad ][ + ] cuando el producto está en la cesta y vuelve a
   «Agregar» al llegar a cero. No cambia el carrito: solo dibuja su estado. */
function accionDe(celda) {
  let stepper = celda.querySelector(".stepper");
  if (!stepper) {
    stepper = document.createElement("span");
    stepper.className = "stepper";
    stepper.hidden = true;
    stepper.innerHTML = '<button type="button" data-accion="restar" aria-label="Quitar uno">−</button>' +
      '<span aria-live="polite">0</span>' +
      '<button type="button" data-accion="sumar" aria-label="Agregar otro">+</button>';
    celda.appendChild(stepper);
    stepper.addEventListener("click", (e) => {
      const b = e.target.closest("[data-accion]");
      if (!b) return;
      const id = celda.dataset.id;
      if (!id) return;
      if (b.dataset.accion === "sumar") sumar(id); else quitarUno(id);
    });
  }
  return { agregar: celda.querySelector(".agregar"), stepper: stepper };
}

function pintarAcciones() {
  $("#lista").querySelectorAll(".fila .accion").forEach((celda) => {
    const piezas = accionDe(celda);
    const cantidad = Number(carrito[celda.dataset.id]) || 0;
    if (piezas.agregar) piezas.agregar.hidden = cantidad > 0;
    piezas.stepper.hidden = cantidad === 0;
    const numero = piezas.stepper.querySelector("span");
    if (numero) numero.textContent = String(cantidad);
  });
}

function abrirPanel() { $("#panel").classList.add("on"); $("#velo").classList.add("on"); $("#panel").setAttribute("aria-hidden", "false"); }
function cerrarPanel() { $("#panel").classList.remove("on"); $("#velo").classList.remove("on"); $("#panel").setAttribute("aria-hidden", "true"); }
$("#bolsa").addEventListener("click", abrirPanel);
$("#cerrar-panel").addEventListener("click", cerrarPanel);
$("#velo").addEventListener("click", cerrarPanel);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#modal").classList.remove("on"); cerrarPanel(); } });

/* ---- KZ-MENU-002 · avisos en página y mensaje de pedido ----
   Antes se usaban los diálogos nativos del navegador —ese cuadro gris que no se puede estilar, que en
   el móvil tapa la pantalla y que el cliente reportó que seguía apareciendo al pedir—. Ahora el aviso se
   pinta dentro de la propia página, en la caja #aviso, con los colores de este menú. */
const miles = (n) => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

function mostrarAviso(mensaje, tipo) {
  const caja = $("#aviso");
  if (!caja) return;
  const clase = tipo === "error" ? "aviso aviso--error" : "aviso";
  caja.innerHTML = '<div class="' + clase + '" role="alert">' + esc(mensaje).replace(/\n/g, "<br>") + "</div>";
  try { caja.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) { /* navegador antiguo */ }
  clearTimeout(mostrarAviso._t);
  mostrarAviso._t = setTimeout(() => {
    if (caja.querySelector(".aviso")) caja.innerHTML = config.promocion ? '<div class="aviso promocion">' + esc(config.promocion) + "</div>" : "";
  }, 10000);
}

/* El número de config ya trae el indicativo (573…): solo se añade 57 si viniera sin él. */
function telInternacional(tel) {
  const n = String(tel || "").replace(/[^0-9]/g, "");
  return n.length === 10 ? "57" + n : n;
}

/* Formato de factura para WhatsApp: detalle con subtotales y total general. */
function mensajePedido(items, codigo) {
  const lineas = items.map((i) => "▪️ " + i.cantidad + "x " + i.nombre + " — $" + miles((Number(i.precio) || 0) * i.cantidad));
  const total = items.reduce((s, i) => s + (Number(i.precio) || 0) * i.cantidad, 0);
  return [
    "🛍️ *NUEVO PEDIDO EN " + String(NEGOCIO.nombre || "").toUpperCase() + "*",
    "📝 Código: *" + codigo + "*",
    "----------------------------",
    "*DETALLE DEL PEDIDO:*",
    ...lineas,
    "----------------------------",
    "💵 *TOTAL A PAGAR: $" + miles(total) + "*",
    "----------------------------",
    "⚠️ _El valor total y la disponibilidad quedan pendientes de confirmación por parte del negocio._"
  ].join("\n");
}

function urlWhatsApp(items, codigo, tel) {
  return "https://wa.me/" + telInternacional(tel) + "?text=" + encodeURIComponent(mensajePedido(items, codigo));
}

$("#pedir").addEventListener("click", async () => {
  const btn = $("#pedir");
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "Registrando pedido…";
  /* La pestaña de WhatsApp se reserva AHORA, dentro del clic del usuario: si se abre después de los
     await, el navegador la bloquea como ventana emergente. */
  let ventanaWA = null;
  try { ventanaWA = window.open("", "_blank"); } catch (e) { ventanaWA = null; }
  const KP = "ks-intento", KC = "ks-codigo";
  let uuid = sessionStorage.getItem(KP);
  if (!uuid) { uuid = (crypto.randomUUID ? crypto.randomUUID() : "p-" + Date.now() + "-" + Math.random().toString(16).slice(2)); sessionStorage.setItem(KP, uuid); }
  let codigo = sessionStorage.getItem(KC);
  if (!codigo) { const a = new Uint8Array(12); crypto.getRandomValues(a); codigo = Array.from(a).map((b) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join(""); sessionStorage.setItem(KC, codigo); }
  const enCarrito = Object.entries(carrito).map(([id, cant]) => { const p = productos.find((x) => String(x.id) === String(id)); return p ? { id: p.id, nombre: p.nombre, precio: p.precio || 0, cantidad: cant } : null; }).filter(Boolean);
  if (!enCarrito.length) { btn.disabled = false; btn.textContent = "Pedir por WhatsApp"; return; }
  /* Antes de registrar: comprobar contra Firebase que todo sigue disponible y al precio actual. */
  let verificacion = null;
  try { verificacion = await verificarAntesDePedir(enCarrito); } catch (e) { verificacion = null; }
  if (!verificacion) {
    mostrarAviso("No pudimos verificar la disponibilidad de tu pedido. No se registró nada y no se cobró nada: revisa tu conexión y vuelve a intentarlo.", "error");
    btn.disabled = false; btn.textContent = "Pedir por WhatsApp"; pintarCarrito(); return;
  }
  aplicarCatalogo(verificacion.catalogo);
  if (verificacion.bloqueos.length) {
    mostrarAviso("Tu pedido no se registró porque cambió el menú:\n• " + verificacion.bloqueos.join("\n• ") + "\n\nRevisa tu carrito y vuelve a intentarlo.", "error");
    btn.disabled = false; btn.textContent = "Pedir por WhatsApp"; pintarCarrito(); return;
  }
  const items = verificacion.items;
  const qa = qaMenu();
  const b = baseDatos();
  const base = b.base;
  const consultaNs = b.consultaNs;
  if (qa) console.log("[QA] menu escribiendo en el EMULADOR · ns demo-sec-v5-default-rtdb");
  const ns = NEGOCIO.ns;
  const cuerpo = {};
  cuerpo[ns + "/pedidos/" + uuid] = { codigoConsulta: codigo, estado: "COTIZACION_PENDIENTE", total: 0, fechaCreacion: Date.now(), items };
  cuerpo[ns + "/pedidos_privados/" + uuid] = { codigoConsulta: codigo, items };
  cuerpo[ns + "/pedidos_publico/" + codigo] = { estado: "COTIZACION_PENDIENTE", fecha: new Date().toISOString().slice(0, 10), total: 0 };
  try {
    const r = await fetch(base + "/.json" + consultaNs, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    if (r.status !== 200) throw new Error("respuesta " + r.status);
    sessionStorage.removeItem(KP); sessionStorage.removeItem(KC);
    carrito = {}; guardar(); pintarCarrito(); cerrarPanel();
    const tel = String(config.whatsapp || config.telefono || "").replace(/[^0-9]/g, "");
    mostrarAviso("Pedido registrado con el código " + codigo + ". Te llevamos a WhatsApp con el detalle y el total.", "ok");
    if (!tel) {
      mostrarAviso("Tu pedido quedó registrado con el código " + codigo + ", pero el negocio no tiene un WhatsApp configurado. Escríbele directamente para enviarlo.", "error");
    } else {
      const destino = urlWhatsApp(items, codigo, tel);
      if (ventanaWA && !ventanaWA.closed) ventanaWA.location.href = destino;
      else window.location.assign(destino);
    }
  } catch (e) {
    mostrarAviso("No pudimos registrar tu pedido (" + e.message + "). Revisa tu conexión y reintenta: no se cobró nada y tu intento queda guardado.", "error");
  } finally { btn.disabled = false; btn.textContent = "Pedir por WhatsApp"; pintarCarrito(); }
});

cargar();
</script>
